<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b392d"><title>Khis — loading</title><style>html,body{margin:0;height:100%;display:grid;place-items:center;background:#f7f2e8;color:#0b392d;font-family:system-ui}.l{text-align:center}.m{width:48px;height:48px;margin:auto;border-radius:18px;background:#0b392d;color:#f7f2e8;display:grid;place-items:center;font:700 26px Georgia}p{opacity:.65}</style></head><body><div class="l"><div class="m">K</div><p>Opening the Khis demo…</p></div><script>(async()=>{try{let a='';for(let i=0;i<9;i++)a+=await(await fetch(`p/${i}.txt`)).text();const b=atob(a),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);const s=new DecompressionStream('gzip'),t=await new Response(new Blob([u]).stream().pipeThrough(s)).text();document.open();document.write(t);document.close()}catch(e){document.body.innerHTML='<main style="max-width:520px;padding:32px"><h1>Khis</h1><p>Could not load the interactive demo. Please refresh in a current browser.</p></main>';console.error(e)}})()</script></body></html>
